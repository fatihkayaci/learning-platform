name: learning-platform
version: '3.8'

services:
  identity.db:
    image: postgres:16-alpine
    container_name: identity_postgres_db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - identity_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      
  pgadmin:
    image: dpage/pgadmin4
    container_name: identity_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: fatih@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - identity.db

volumes:
  identity_pg_data:
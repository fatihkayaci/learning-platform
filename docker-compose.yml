name: learning-platform

services:
  identity-db:
    image: postgres:16-alpine
    container_name: lp_identity_db
    environment:
      - POSTGRES_USER=${IDENTITY_DB_USER}
      - POSTGRES_PASSWORD=${IDENTITY_DB_PASSWORD}
      - POSTGRES_DB=${IDENTITY_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - lp_identity_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IDENTITY_DB_USER} -d ${IDENTITY_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-db:
    image: postgres:16-alpine
    container_name: lp_catalog_db
    environment:
      - POSTGRES_USER=${CATALOG_DB_USER}
      - POSTGRES_PASSWORD=${CATALOG_DB_PASSWORD}
      - POSTGRES_DB=${CATALOG_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - lp_catalog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_DB_USER} -d ${CATALOG_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  enrollment-db:
    image: postgres:16-alpine
    container_name: lp_enrollment_db
    environment:
      - POSTGRES_USER=${ENROLLMENT_DB_USER}
      - POSTGRES_PASSWORD=${ENROLLMENT_DB_PASSWORD}
      - POSTGRES_DB=${ENROLLMENT_DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - lp_enrollment_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ENROLLMENT_DB_USER} -d ${ENROLLMENT_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-db:
    image: postgres:16-alpine
    container_name: lp_notification_db
    environment:
      - POSTGRES_USER=${NOTIFICATION_DB_USER}
      - POSTGRES_PASSWORD=${NOTIFICATION_DB_PASSWORD}
      - POSTGRES_DB=${NOTIFICATION_DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - lp_notification_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATION_DB_USER} -d ${NOTIFICATION_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: lp_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_NAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - lp_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: lp_redis
    ports:
      - "6379:6379"
    volumes:
      - lp_redis_data:/data

  seq:
    image: datalust/seq:latest
    container_name: lp_seq
    environment:
      ACCEPT_EULA: Y
    ports:
      - "5341:5341"
      - "5342:80"

  pgadmin:
    image: dpage/pgadmin4
    container_name: lp_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PG_ADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PG_ADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - identity-db
      - catalog-db
      - enrollment-db
      - notification-db

volumes:
  lp_redis_data:
  lp_identity_db_data:
  lp_catalog_db_data:
  lp_enrollment_db_data:
  lp_notification_db_data:
  lp_rabbitmq_data:
